[package]
name = "metal-wasm"
version = "0.1.0"
edition = "2024"
description = "Run independent WebAssembly functions in parallel on Metal"

[dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder",
    "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice",
    "MTLLibrary", "MTLResource", "MTLTypes", "objc2-core-foundation",
] }
wasmparser = { version = "0.259", default-features = false, features = ["std", "validate", "features", "simd"] }

[dev-dependencies]
wasmi = { version = "2.0", default-features = false, features = ["stable", "std", "validate"] }
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-drc"] }
wast = "259"
wat = "1"
